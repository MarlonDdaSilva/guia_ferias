<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia de Férias</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Guia de Férias</h1>
    </header>
    <main>
        <section>
            <h2>Opções para suas férias</h2>
            <p>
                Escolha uma opção para visualizar mais informações.
            </p>
            <!-- Os cards serão criados pelo JavaScript -->
            <div id="lista-destinos">
                <p>Carregando destinos...</p>
            </div>
        </section>
        <section id="detalhes">
            <h2>Destino selecionado</h2>
            <!-- Os detalhes aparecerão aqui -->
            <div id="detalhes-destino">
                <p>
                    Selecione uma opção para visualizar os detalhes.
                </p>
            </div>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>

</html>
